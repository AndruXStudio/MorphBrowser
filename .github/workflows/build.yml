name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.5'
          channel: 'stable'
          cache: true

      - name: Setup Android project
        run: |
          flutter create --org com.andrux --project-name morph_browser --platforms=android /tmp/mb
          cp -a /tmp/mb/android .
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"\/>\n    <application/' "$MANIFEST"
          fi
          if ! grep -q 'usesCleartextTraffic' "$MANIFEST"; then
            sed -i 's/<application/<application android:usesCleartextTraffic="true"/' "$MANIFEST"
          fi
          mkdir -p android/app/src/main/res/xml
          printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' '<network-security-config>' '    <base-config cleartextTrafficPermitted="true" />' '</network-security-config>' > android/app/src/main/res/xml/network_security_config.xml
          if ! grep -q 'networkSecurityConfig' "$MANIFEST"; then
            sed -i 's/<application/<application android:networkSecurityConfig="@xml\/network_security_config"/' "$MANIFEST"
          fi
          # NDK version for plugins
          GRADLE=android/app/build.gradle.kts
          if [ -f "$GRADLE" ] && ! grep -q 'ndkVersion' "$GRADLE"; then
            sed -i 's/android {/android {\n    ndkVersion = "27.0.12077973"/' "$GRADLE"
          fi
          GRADLE2=android/app/build.gradle
          if [ -f "$GRADLE2" ] && ! grep -q 'ndkVersion' "$GRADLE2"; then
            sed -i 's/android {/android {\n    ndkVersion "27.0.12077973"/' "$GRADLE2"
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos || true

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
